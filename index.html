<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow-up Playbook</title>
<style>
:root{--red:#EB0A1E;--ink:#1a1a1a;--mute:#666;--line:#e3e3e3}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#fafafa}
header{background:#fff;border-bottom:3px solid var(--red);padding:12px 16px;position:sticky;top:0;z-index:5}
h1{margin:0 0 8px;font-size:20px}h1 span{color:var(--red)}
.wrap{max-width:960px;margin:0 auto;padding:12px 16px 80px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
select,input,textarea{font:inherit;padding:10px;border:1px solid #ccc;border-radius:8px;min-height:44px;background:#fff}
textarea{width:100%;min-height:140px}
button{font:inherit;min-height:44px;padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}
button.p{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
button.d{color:var(--red);border-color:var(--red)}
.fill{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.fill label{font-size:12px;color:var(--mute);display:flex;flex-direction:column}
details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}
summary{cursor:pointer;font-weight:600;min-height:32px}
.phase{margin:18px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:12px;margin:8px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.tag{background:#f1f1f1;border-radius:20px;padding:2px 10px}.day{font-weight:700}
.note{font-style:italic;color:var(--mute);margin:6px 0}
.subj{font-weight:600;margin:6px 0}
pre{white-space:pre-wrap;font:inherit;margin:6px 0;background:#fcfcfc;padding:8px;border-radius:6px}
.copy{font-size:17px;min-width:120px}
.tools button{min-height:40px;padding:6px 10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:24px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
dialog{border:none;border-radius:12px;width:min(640px,94vw);padding:16px}
dialog label{display:block;margin:8px 0;font-size:14px;color:var(--mute)}dialog input,dialog select{width:100%}
.src{font-size:12px;color:var(--mute)}
select,input,textarea{max-width:100%;box-sizing:border-box}#scen{flex:1 1 100%;min-width:0}</style></head><body>
<header><h1>Follow-up <span>Playbook</span></h1>
<div class="fill" id="fill"></div></header>
<div class="wrap">
<div class="row"><select id="scen" aria-label="Scenario"></select>
<select id="chan" aria-label="Channel"><option value="">All channels</option><option>Text</option><option>Email</option><option>Call</option></select>
<select id="phase" aria-label="Phase"><option value="">All phases</option></select>
<input id="q" type="search" placeholder="Search all scenarios..." style="flex:1;min-width:180px"></div>
<div class="row tools"><button id="addS">+ Scenario</button><button id="renS">Rename / notes</button><button id="delS" class="d">Delete scenario</button><button id="addSt" class="p">+ Step</button>
<button id="loadT" class="p">Load latest templates</button><button id="exp">Export JSON</button><button id="imp">Import JSON</button><input type="file" id="file" accept=".json,application/json" hidden></div>
<div id="notes"></div><div id="list"></div></div>
<div id="toast">Copied</div>
<dialog id="dlg"><form method="dialog" id="f"><h3 id="dt">Step</h3>
<label>Timing (e.g. Day 3)<input name="day"></label>
<label>Channel<select name="channel"><option>Text</option><option>Email</option><option>Call</option><option>Call + text</option></select></label>
<label>Phase<input name="phase" list="phases"></label><datalist id="phases"></datalist>
<label>Purpose label<input name="label"></label>
<label>Note (instructions, not copied)<input name="note"></label>
<label>Email subject<input name="subject"></label>
<label>Message<textarea name="body"></textarea></label>
<div class="row"><button value="cancel" formnovalidate>Cancel</button><button value="ok" class="p">Save</button></div></form></dialog>
<dialog id="sdlg"><form method="dialog"><h3>Scenario</h3><label>Name<input name="name" required></label>
<label>Notes / rules (one per line)<textarea name="notes"></textarea></label>
<div class="row"><button value="cancel" formnovalidate>Cancel</button><button value="ok" class="p">Save</button></div></form></dialog>
<script>
const KEY='followupPlaybook.v1',FKEY='followupPlaybook.fill';
const uid=()=>Math.random().toString(36).slice(2,10);
const SEED={scenarios:[{id:'cold',name:'Lead went cold / ghosted',notes:"Cold = no reply in 7+ days.\nSwitch channels. If they ignore texts, try email or a call.\nNever send 'just checking in.' Every touch needs a reason: a new car, a price change, a tip, or a deadline.\nOnce they reply, drop the schedule and work the deal.\nIf they bought elsewhere, congratulate them and offer service and referrals.",steps:[
{day:'Day 1',channel:'Text',phase:'Phase 1: Re-engage',label:'Easy out',body:"Hi [Name], it's [Salesperson] at [Dealership]. Are you still looking at the [Vehicle], or did you find something? Either answer helps me out."},
{day:'Day 3',channel:'Email',phase:'Phase 1: Re-engage',label:'New info',subject:'[Vehicle] update for you',body:"Hi [Name],\n\nI wanted to pass along something new on the [Vehicle]. I put together a quick walkaround so you can see it up close, and there have been some updates on pricing and programs since we last talked. A similar unit also just landed on our lot if you want options.\n\nYou can see the details here: [Ad link]\n\nWant me to hold it for a look this week? Call, text, or email me at [Phone], whichever is easiest.\n\nThanks,\n[Salesperson]\n[Dealership]\n[Phone]"},
{day:'Day 6',channel:'Text',phase:'Phase 1: Re-engage',label:'Yes or no',body:"Quick one, [Name]. Should I keep watching for a [Vehicle] for you, yes or no?"},
{day:'Day 10',channel:'Call + text',phase:'Phase 1: Re-engage',label:'Voicemail follow-up',note:'Leave a voicemail under 20 seconds, then text:',body:"Left you a quick voicemail. No rush, just text me back when it suits."},
{day:'Day 14',channel:'Text',phase:'Phase 2: Breakup',label:'Breakup',body:"Hi [Name], I haven't heard back, so I'll assume the timing isn't right and stop bugging you. If anything changes, I'm here."},
{day:'Day 30',channel:'Email',phase:'Phase 3: Long nurture',label:'New inventory / incentives',subject:'New arrivals and month-end offers on the [Vehicle]',body:"Hi [Name],\n\nA few new units have come in that line up with what you were looking for in a [Vehicle], and there are some month-end incentives running right now that make the numbers worth a second look.\n\nHere's what just arrived: [Ad link]\n\nIf one catches your eye, I can set up a quick visit or a test drive at a time that works for you. Just reply here or reach me at [Phone].\n\nThanks,\n[Salesperson]\n[Dealership]\n[Phone]"},
{day:'Day 45',channel:'Text',phase:'Phase 3: Long nurture',label:'Seasonal hook',body:"Hi [Name], [Salesperson] here. Winter's coming, and we've got deals on winter tire packages and remote starters plus year-end clearout pricing. Want me to send you what fits a [Vehicle]?"},
{day:'Day 60',channel:'Email',phase:'Phase 3: Long nurture',label:'Tech tip',subject:'A quick tip before you buy used',body:"Hi [Name],\n\nBefore I was in sales I worked as a Red Seal journeyman automotive technician, so here's one thing I always tell people shopping used: ask for the service history and look at the tires and brakes yourself. Uneven tire wear can point to alignment or suspension issues, and a car with regular oil changes on record is usually a much safer bet than one with gaps.\n\nWhether you buy from me or not, I'm happy to look over any vehicle you're considering. If you'd like to talk it through, reach me at [Phone].\n\nThanks,\n[Salesperson]\n[Dealership]\n[Phone]"},
{day:'Day 90',channel:'Text',phase:'Phase 3: Long nurture',label:'Trade value',body:"Still driving the same ride, [Name]? Trade values are strong right now if you want a number."},
{day:'Quarterly',channel:'Text',phase:'Phase 3: Long nurture',label:'Check-in',body:"Hi [Name], [Salesperson] at [Dealership]. With year-end (and tax season) around the corner, there are usually good programs out. If you're thinking about a [Vehicle] again, I'm happy to run numbers."}
]}]};
SEED.scenarios[0].steps.forEach(s=>s.id=uid());
const EXTRA=[{"id": "first-response", "name": "First Response (new inquiry)", "notes": "Send within 5 minutes of the lead coming in.\nCall first if you can, then send this.", "steps": [{"day": "Initial", "channel": "Email", "phase": "", "label": "Short", "subject": "Thanks for your inquiry, [Name]", "body": "Hi [Name],\n\nThank you for reaching out to West Edmonton Mall Toyota. I'm looking forward to helping with your vehicle search.\n\nI'd like to learn a little more about what you need so we can find the right vehicle for your needs and budget. When is a good time for a quick call, or would you like to stop by the store to look at options?\n\nHappy to answer any questions in the meantime. Call, text, or email me anytime at 780-446-5748."}, {"day": "Initial", "channel": "Email", "phase": "", "label": "Detailed (with ad link)", "subject": "Your inquiry on the [Vehicle]", "body": "Hi [Name],\n\nThank you for reaching out to West Edmonton Mall Toyota. I'm looking forward to helping with your vehicle search.\n\nHere's the vehicle you asked about:\n[Ad link]\n\nI'd be happy to answer any questions, walk you through the vehicle and its features, or set up a time for you to come in and take it for a test drive.\n\nWhat works better for you, a quick call or a visit to the dealership? Call, text, or email me anytime at 780-446-5748.\n\nI look forward to hearing from you."}], "seedVersion": 4}, {"id": "trade-known", "name": "Trade Appraisal - First Response (vehicle of interest known)", "notes": "Use when they asked about a trade and you know (or are asking) what they want next.", "steps": [{"day": "Initial", "channel": "Email", "phase": "", "label": "Appraisal invite", "subject": "Appraisal for your [Your vehicle]", "body": "Hi [Name],\n\nThank you for asking about an appraisal on your [Your vehicle]. We'd love to have it on our lot, and I want to make sure you get top dollar for it.\n\nAre you available to stop in for a quick 20 to 30 minute appraisal in the next few days? If that's tough to fit in, send me a few photos along with the VIN and mileage to dmiller@wemtoyota.com, and I'll start a pre-appraisal and give you a rough idea of its value.\n\nAre you looking only to sell, or would you like to replace it with something new to you as well?\n\nWhen would be a good time to stop by? Call, text, or email me at 780-446-5748."}], "seedVersion": 4}, {"id": "trade-none", "name": "Trade Appraisal - No Vehicle Selected", "notes": "", "steps": [{"day": "Initial", "channel": "Text", "phase": "", "label": "Short", "body": "Hi [Name], it's Derek at West Edmonton Mall Toyota. Thanks for reaching out about your [Your vehicle]. Happy to do an appraisal. When's a good time to swing by so I can see it in person? And what are you thinking of trading up to?"}, {"day": "Initial", "channel": "Email", "phase": "", "label": "Email", "subject": "Appraisal for your [Your vehicle]", "body": "Hi [Name],\n\nThank you for reaching out about your [Your vehicle]. I'd be happy to do an appraisal for you. Is there a time in the next few days when you could swing by so we can see it in person?\n\nAlso, what are you interested in trading up to? I'd love to help you find your next vehicle.\n\nCall, text, or email me at 780-446-5748."}], "seedVersion": 4}, {"id": "preappraisal", "name": "Trade Pre-Appraisal Info Request (detailed checklist)", "notes": "", "steps": [{"day": "Initial", "channel": "Email", "phase": "", "label": "Detailed", "subject": "Free pre-appraisal for your [Your vehicle]", "body": "Hi [Name],\n\nThank you for reaching out about having your [Your vehicle] appraised.\n\nI'd be happy to put together a free, no-obligation pre-appraisal for you. The more information you can send, the more accurate I can make it.\n\nVehicle information:\n- VIN\n- Year, make, model and trim\n- Exact current mileage\n- Tire condition, including remaining tread if known\n- Windshield condition\n- Any dents, scratches, damage or previous accidents\n- Any aftermarket modifications or accessories\n- Any remaining extended warranties or protection packages\n- Number of keys and remotes, and whether you have the original key fobs\n- Winter or summer tires and wheels, or any additional sets\n- Any other accessories or equipment that may add value\n\nFinancial information:\n- Current amount owing, if any\n- Current monthly payment\n- Current interest rate, if known\n- Approximate remaining term, if known\n\nPhotos:\nIf possible, please send a few clear pictures of the exterior and interior, including all four corners, the wheels and tires, the driver's seat and dashboard, and any areas with damage or wear. You can reply here or send them to dmiller@wemtoyota.com.\n\nWhat are you looking to do with the vehicle?\nKnowing this helps me tailor the appraisal to what you want to accomplish. Are you looking to sell it outright, or put it toward an upgrade? If you're thinking about upgrading, let me know what you have in mind, whether that's a newer version of your current vehicle, a different model, an SUV, a truck or a hybrid. If you have a specific vehicle in mind, even better.\n\nThere's no obligation either way. My goal is to give you a clear picture of what your vehicle is worth and, if you're considering an upgrade, show you what your options could look like.\n\nOnce I have the details, I'll get the pre-appraisal started and follow up with the numbers. For a firm number, a quick 20 to 30 minute visit is the next step. Call, text, or email me at 780-446-5748."}], "seedVersion": 4}, {"id": "questions-td", "name": "Vehicle Questions / Test Drive Follow-up", "notes": "Dropped 'lots of interest on it' (only say it if it's true).", "steps": [{"day": "Initial", "channel": "Text", "phase": "", "label": "Short", "body": "Hi [Name], it's Derek at West Edmonton Mall Toyota. Any questions on the [Vehicle] I can help with? It's still available. When works for a test drive?"}, {"day": "Initial", "channel": "Email", "phase": "", "label": "Email", "subject": "Any questions on the [Vehicle]?", "body": "Hi [Name],\n\nDo you have any questions about the [Vehicle]? I'm happy to send more information to make your decision easier.\n\nThe vehicle is still available as of today, but good units don't tend to stay long. When can we set up a test drive? We're open Monday to Saturday 9am to 9pm and Sunday 10am to 6pm.\n\nCall, text, or reply here so I can best assist you. You can reach me at 780-446-5748."}], "seedVersion": 4}, {"id": "friday", "name": "Friday Follow-up", "notes": "Store hours: Mon-Sat 9am-9pm, Sun 10am-6pm.", "steps": [{"day": "Initial", "channel": "Email", "phase": "", "label": "Short", "subject": "Happy Friday from West Edmonton Mall Toyota", "body": "Hi [Name],\n\nHappy Friday! I just wanted to touch base heading into the weekend.\n\nWe're open Saturday 9am to 9pm and Sunday 10am to 6pm, and I have availability if you'd like to stop in to test drive and look over the [Vehicle]. Call or text me at 780-446-5748 and we'll find a time that works.\n\nHave a great day!"}, {"day": "Initial", "channel": "Email", "phase": "", "label": "Detailed", "subject": "Happy Friday from West Edmonton Mall Toyota", "body": "Hi [Name],\n\nHappy Friday! As you head into the weekend, it's a great time to look over your new Toyota and pre-owned options. We're open Saturday 9am to 9pm and Sunday 10am to 6pm.\n\nIf you'd like to come in, let me know what day and time work best and I'll have everything ready. I'm excited to show you what West Edmonton Mall Toyota has to offer.\n\nCall, text, or email me at 780-446-5748."}], "seedVersion": 4}, {"id": "sold-alt", "name": "Vehicle Sold - Alternative", "notes": "'Approximately 50 fresh pre-owned units weekly' softened to 'fresh pre-owned inventory in regularly'. Confirm the number to restore it.", "steps": [{"day": "Initial", "channel": "Email", "phase": "", "label": "Email", "subject": "Your first choice sold - let's find a great alternative", "body": "Hi [Name],\n\nThanks for your interest in the [Vehicle]. Unfortunately, that vehicle has already found a new home. With our competitive pricing and no-nonsense approach, our inventory moves quickly.\n\nThe good news is we get fresh pre-owned inventory in regularly. If you describe the vehicle you're ideally looking for, I'll keep an eye out for you.\n\nCan we connect today to go over your options together? Do you prefer phone, text or email? I'm looking forward to answering your questions and finding your next vehicle.\n\nYou can reach me at 780-446-5748."}], "seedVersion": 4}, {"id": "reengage", "name": "Re-engagement", "notes": "", "steps": [{"day": "Initial", "channel": "Text", "phase": "", "label": "Text", "body": "Hi [Name], it's Derek at West Edmonton Mall Toyota. It's been a few days since your inquiry and we haven't connected yet. Are you still searching, or have you found something? When's a good time to chat about options?"}, {"day": "Initial", "channel": "Email", "phase": "", "label": "Short", "subject": "Still in the market, [Name]?", "body": "Hi [Name],\n\nThank you again for your inquiry with West Edmonton Mall Toyota. I've tried to reach you over the past few days but haven't heard back.\n\nAre you still in the market for your next vehicle? I'm only here to help, I just need a little guidance from you. A quick reply with where you're at would be great.\n\nYou can reply here, or call or text me at 780-446-5748."}, {"day": "Initial", "channel": "Email", "phase": "", "label": "Detailed", "subject": "Where are you at in your vehicle search?", "body": "Hi [Name],\n\nThank you again for your inquiry with West Edmonton Mall Toyota. I've tried to connect over the past several days but haven't heard back. I know things get busy, so I wanted to reach out one more time and ask where you're at in your vehicle search.\n\nIf you're still looking, I'd love to help. Whether you have questions about a specific vehicle, want to compare a few options, need financing or payment information, have a trade-in you'd like appraised, or aren't sure which vehicle is the best fit, I'm here to make the process easy. We have a large selection of new and pre-owned vehicles, and if the one you asked about isn't quite right, I'm happy to help you look at others.\n\nEven a quick reply with one of these would be greatly appreciated:\n- Yes, I'm still looking - please contact me.\n- I'm still looking, but my needs have changed.\n- I found a vehicle - you can close my inquiry.\n- I'm putting my search on hold for now.\n\nIf you've already found a vehicle, congratulations! Just let me know and I'll update our records and respect your privacy.\n\nIf you're still looking, I'd be glad to go to work for you and find the right vehicle at the right price. Call, text, or email me at 780-446-5748."}], "seedVersion": 4}, {"id": "day4", "name": "4-Day Follow-up", "notes": "Urgency kept, but honest: no claims about other buyers unless true.", "steps": [{"day": "Initial", "channel": "Email", "phase": "", "label": "Email", "subject": "Quick follow-up on [Vehicle] options", "body": "Hi [Name],\n\nSorry for all the emails and texts. I try to act quickly because the pre-owned market moves fast, and I want to make sure you get the right vehicle at the right price with the kilometres you want.\n\nWe have some great [Vehicle] options right now, but good units don't tend to stay long.\n\nCan we connect today to find the right one for you? Call, text, or email me at 780-446-5748."}], "seedVersion": 4}, {"id": "appt", "name": "Appointment Confirmation", "notes": "", "steps": [{"day": "Initial", "channel": "Text", "phase": "", "label": "Text", "body": "Hi [Name], Derek here at West Edmonton Mall Toyota. Just confirming you can make your appointment with me today at [Time] to see the [Vehicle]. Simply reply YES or NO, and let me know if we need to adjust the time. Looking forward to your visit!"}], "seedVersion": 4}, {"id": "still", "name": "Still in Market / Close File?", "notes": "", "steps": [{"day": "Initial", "channel": "Text", "phase": "", "label": "Short", "body": "Good morning [Name], Derek at West Edmonton Mall Toyota. Are you still in the market for a vehicle? If so, I'd be happy to help. If you've already found something, just let me know and I'll close your file."}, {"day": "Initial", "channel": "Email", "phase": "", "label": "Email", "subject": "Are you still in the market?", "body": "Good morning [Name],\n\nAre you still in the market for a vehicle? If so, I'd be happy to help you find the right one, and I can set up a time for you to come in and look at a few options.\n\nIf you've already found something, just let me know and I'll close your file.\n\nCall, text, or email me at 780-446-5748."}], "seedVersion": 4}, {"id": "daybefore", "name": "Day Before Closing File (no response)", "notes": "", "steps": [{"day": "Initial", "channel": "Text", "phase": "", "label": "Short", "body": "Hi [Name], Derek at West Edmonton Mall Toyota. We haven't connected in a while. Should I close your file for now? I can always reopen it. If you'd still like help, text or call me today at 780-446-5748."}, {"day": "Initial", "channel": "Email", "phase": "", "label": "Email", "subject": "Should I close your file?", "body": "Hi [Name],\n\nUnfortunately, we haven't been able to connect for a while. Should I close your file for now? I can always reopen it if you're still in the market.\n\nI'm more than happy to help you find your next vehicle, but I'm not sure how to proceed without hearing back from you.\n\nPlease contact me today if you'd like help with your vehicle search. Otherwise, I'll close your file at the end of the day. You can reach me anytime on my cell at 780-446-5748."}], "seedVersion": 4}, {"id": "close-resp", "name": "Closing File - With Responses (thank you)", "notes": "", "steps": [{"day": "Initial", "channel": "Email", "phase": "", "label": "Email", "subject": "Thank you, [Name]", "body": "Hi [Name],\n\nI hope you're doing well. I wanted to let you know I'll be closing your file for now, and to thank you for the chance to earn your business.\n\nIf you're ever back in the market for a new or used vehicle, call, text, or email me directly at 780-446-5748. I'd be glad to help you personally."}], "seedVersion": 4}, {"id": "close-none", "name": "Closing File - No Response", "notes": "Merged two near-duplicate versions.", "steps": [{"day": "Initial", "channel": "Email", "phase": "", "label": "Email", "subject": "Closing your file for now", "body": "Hi [Name],\n\nI hope you're doing well. I've reached out a few times about your inquiry on the [Vehicle] and haven't heard back. Life gets busy, so I'll close the file for now.\n\nIf you find yourself back in the market, reach out anytime and I'll happily reopen it. Call, text, or email me at 780-446-5748.\n\nThank you for considering West Edmonton Mall Toyota."}], "seedVersion": 4}, {"id": "monthend", "name": "Month End Text", "notes": "Use the last few days of the month.", "steps": [{"day": "Initial", "channel": "Text", "phase": "", "label": "Text", "body": "Hi [Name], it's month end at West Edmonton Mall Toyota and I'd love to put together a great deal for you on the [Vehicle]. Are you free to pop in today or tomorrow? Shoot me a text back and I'll get to work."}], "seedVersion": 4}, {"id": "newsletter", "name": "Derek Drives Newsletter", "notes": "Attach the Derek Drives PDF in your email app before sending. The playbook can't hold the file.", "steps": [{"day": "Initial", "channel": "Email", "phase": "", "label": "Email", "subject": "Derek Drives: [Month] edition", "body": "Hi [Name],\n\nHere's what's new this month from Derek Drives. I've attached this month's Derek Drives newsletter.\n\nInside you'll find:\n- [This month's feature]\n- [New arrivals]\n- [Tip of the month]\n\nIf anything catches your eye, or you'd like to book a test drive, call, text, or email me at 780-446-5748.", "note": "Attach the newsletter PDF in your email app."}], "seedVersion": 4}];
SEED.scenarios[0].seedVersion=4;SEED.scenarios.push(...EXTRA);SEED.scenarios.forEach(s=>s.steps.forEach(x=>x.id=x.id||uid()));

const SEED_VERSION=4;
function norm(d){if(Array.isArray(d))d={scenarios:d};if(!d||typeof d!=='object'||!Array.isArray(d.scenarios))return null;
 d.scenarios=d.scenarios.filter(s=>s&&typeof s==='object'&&(s.name||(Array.isArray(s.steps)&&s.steps.length))).map(s=>({...s,id:String(s.id||uid()),name:String(s.name||'Untitled scenario'),notes:typeof s.notes==='string'?s.notes:'',
  steps:(Array.isArray(s.steps)?s.steps:[]).filter(x=>x&&typeof x==='object').map(x=>({...x,id:String(x.id||uid()),channel:String(x.channel||'Text'),day:String(x.day||''),label:String(x.label||''),phase:String(x.phase||''),body:String(x.body||''),subject:x.subject==null?'':String(x.subject),note:x.note==null?'':String(x.note)}))}));
 const seen=new Set();d.scenarios.forEach(s=>{if(seen.has(s.id))s.id=uid();seen.add(s.id)});return d}
const clone=o=>JSON.parse(JSON.stringify(o));
let db=null;try{db=norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){db=null}
if(!db||!db.scenarios.length)db={scenarios:clone(SEED.scenarios),seedVersion:SEED_VERSION};
function outdated(){return db.scenarios.filter(o=>{const b=SEED.scenarios.find(x=>x.id===o.id);return b&&(o.seedVersion||1)<SEED_VERSION})}
// startup: silently add built-ins missing by id and name
SEED.scenarios.forEach(b=>{const k=b.name.trim().toLowerCase();if(!db.scenarios.some(o=>o.id===b.id||o.name.trim().toLowerCase()===k))db.scenarios.push(clone(b))});
if(!outdated().length)db.seedVersion=SEED_VERSION;
const FIELDS=[['Name',''],['Vehicle',''],['Ad link',''],['Salesperson','Derek'],['Dealership','West Edmonton Mall Toyota'],['Phone','780-446-5748']];
let fill; try{fill=JSON.parse(localStorage.getItem(FKEY))||{};if(typeof fill!=='object')fill={}}catch(e){fill={}} FIELDS.forEach(([k,d])=>{if(fill[k]===undefined)fill[k]=d});
let cur=db.scenarios[0]&&db.scenarios[0].id;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save on this device')}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sub=t=>String(t||'').replace(/\[([^\]]+)\]/g,(m,k)=>fill[k]&&fill[k].trim()?fill[k]:m);
const scen=()=>db.scenarios.find(s=>s.id===cur)||db.scenarios[0];
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1200)}
function legacyCopy(t){const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(a);a.focus();a.select();try{a.setSelectionRange(0,t.length)}catch(e){}let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}
async function copy(t){let ok=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);ok=true}}catch(e){}
 if(!ok)ok=legacyCopy(t);if(ok)toast('Copied');else window.prompt('Copy this text:',t)}
$('fill').innerHTML=FIELDS.map(([k])=>`<label>[${k}]<input data-k="${k}" value="${esc(fill[k])}"></label>`).join('');
$('fill').oninput=e=>{fill[e.target.dataset.k]=e.target.value;localStorage.setItem(FKEY,JSON.stringify(fill));render()};
function renderSel(){$('scen').innerHTML=db.scenarios.map(s=>`<option value="${s.id}"${s.id===cur?' selected':''}>${esc(s.name)}</option>`).join('');
 const ph=[...new Set(db.scenarios.flatMap(s=>s.steps.map(x=>x.phase).filter(Boolean)))];
 const pv=$('phase').value;$('phase').innerHTML='<option value="">All phases</option>'+ph.map(p=>`<option${p===pv?' selected':''}>${esc(p)}</option>`).join('');
 $('phases').innerHTML=ph.map(p=>`<option value="${esc(p)}">`).join('')}
function card(st,s,i,search){const em=st.channel==='Email';
 return `<div class="card"><div class="meta"><span class="day">${esc(st.day)}</span><span class="tag">${esc(st.channel)}</span><b>${esc(st.label)}</b>${search?`<span class="src">in ${esc(s.name)}</span>`:''}</div>
 ${st.note?`<div class="note">${esc(st.note)}</div>`:''}${em&&st.subject?`<div class="subj">Subject: ${esc(sub(st.subject))}</div>`:''}<pre>${esc(sub(st.body))}</pre>
 <div class="row"><button class="p copy" data-a="copy" data-s="${s.id}" data-i="${st.id}">Copy${em&&st.subject?' all':''}</button>
 ${em&&st.subject?`<button data-a="cs" data-s="${s.id}" data-i="${st.id}">Copy subject</button><button data-a="cb" data-s="${s.id}" data-i="${st.id}">Copy body</button>`:''}
 <span class="tools"><button data-a="up" data-s="${s.id}" data-i="${st.id}" aria-label="Move up">&#8593;</button><button data-a="dn" data-s="${s.id}" data-i="${st.id}" aria-label="Move down">&#8595;</button><button data-a="ed" data-s="${s.id}" data-i="${st.id}">Edit</button><button class="d" data-a="del" data-s="${s.id}" data-i="${st.id}">Delete</button></span></div></div>`}
function render(){renderSel();const q=$('q').value.trim().toLowerCase(),ch=$('chan').value,ph=$('phase').value;
 const ok=st=>(!ch||st.channel.includes(ch))&&(!ph||st.phase===ph)&&(!q||[st.day,st.channel,st.label,st.note,st.subject,st.body,st.phase].join(' ').toLowerCase().includes(q));
 const s=scen();$('notes').innerHTML=!q&&s&&s.notes?`<details><summary>Rules / notes</summary><ul>${s.notes.split('\n').filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join('')}</ul></details>`:'';
 let h='';const pool=q?db.scenarios:(s?[s]:[]);
 pool.forEach(sc=>{let last=null;sc.steps.forEach((st,i)=>{if(!ok(st))return;if(st.phase!==last){last=st.phase;if(st.phase)h+=`<div class="phase">${esc(st.phase)}</div>`}h+=card(st,sc,i,!!q)})});
 $('list').innerHTML=h||'<p style="color:#666">No steps here yet. Tap "+ Step" to add one.</p>'}
$('list').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const s=db.scenarios.find(x=>x.id===b.dataset.s),i=s.steps.findIndex(x=>x.id===b.dataset.i),st=s.steps[i];
 ({copy:()=>copy(st.channel==='Email'&&st.subject?`Subject: ${sub(st.subject)}\n\n${sub(st.body)}`:sub(st.body)),cs:()=>copy(sub(st.subject)),cb:()=>copy(sub(st.body)),
 up:()=>{if(i>0){[s.steps[i-1],s.steps[i]]=[s.steps[i],s.steps[i-1]];save();render()}},dn:()=>{if(i<s.steps.length-1){[s.steps[i+1],s.steps[i]]=[s.steps[i],s.steps[i+1]];save();render()}},
 ed:()=>editStep(s,st),del:()=>{if(confirm(`Delete step "${st.day} - ${st.label}"?`)){s.steps.splice(i,1);save();render()}}})[b.dataset.a]()};
function editStep(s,st){const f=$('f'),isNew=!st;st=st||{id:uid(),channel:'Text',phase:s.steps.at(-1)?.phase||''};$('dt').textContent=isNew?'Add step':'Edit step';
 ['day','channel','phase','label','note','subject','body'].forEach(k=>f.elements[k].value=st[k]||'');const d=$('dlg');
 d.onclose=()=>{if(d.returnValue!=='ok')return;['day','channel','phase','label','note','subject','body'].forEach(k=>st[k]=f.elements[k].value.trim());if(isNew)s.steps.push(st);save();render()};d.returnValue='';d.showModal()}
function editScen(s){const d=$('sdlg'),f=d.querySelector('form');f.elements.name.value=s?s.name:'';f.elements.notes.value=s?s.notes||'':'';
 d.onclose=()=>{if(d.returnValue!=='ok'||!f.elements.name.value.trim())return;if(!s){s={id:uid(),steps:[]};db.scenarios.push(s);cur=s.id}s.name=f.elements.name.value.trim();s.notes=f.elements.notes.value;save();render()};d.returnValue='';d.showModal()}
$('scen').onchange=e=>{cur=e.target.value;render()};$('chan').onchange=$('phase').onchange=$('q').oninput=render;
$('addS').onclick=()=>editScen(null);$('renS').onclick=()=>scen()&&editScen(scen());
$('delS').onclick=()=>{const s=scen();if(s&&confirm(`Delete scenario "${s.name}" and all its steps?`)){db.scenarios=db.scenarios.filter(x=>x!==s);cur=db.scenarios[0]?.id;save();render()}};
$('addSt').onclick=()=>{if(!scen())return alert('Add a scenario first.');editStep(scen(),null)};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='followup-playbook-'+new Date().toISOString().slice(0,10)+'.json';a.click()};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;let d;try{d=norm(JSON.parse(await fl.text()));if(!d)throw 0}catch(x){return alert('That file is not a valid playbook export.')}
 if(confirm('OK = MERGE into your library (matching scenarios updated, new ones added).\nCancel = choose REPLACE instead.')){d.scenarios.forEach(n=>{const i=db.scenarios.findIndex(o=>o.id===n.id);i>=0?db.scenarios[i]=n:db.scenarios.push(n)})}
 else if(confirm('REPLACE your entire library with this file? This cannot be undone.')){db=d;if(!db.scenarios.length)db.scenarios=clone(SEED.scenarios)}else return;
 db.scenarios.forEach(s=>s.steps.forEach(x=>x.id=x.id||uid()));cur=db.scenarios[0]?.id;save();render();toast('Imported')};
save();render();

function loadLatest(){const key=s=>s.name.trim().toLowerCase();let add=0,upd=0;
 SEED.scenarios.forEach(b=>{if(!db.scenarios.some(o=>o.id===b.id||key(o)===key(b))){db.scenarios.push(clone(b));add++}});
 const od=outdated();
 if(od.length&&confirm('Update '+od.length+' built-in template scenario(s) to the latest version?\n\n'+od.map(o=>o.name).join('\n')+'\n\nYour edits to these built-in scenarios will be replaced. Scenarios you created are never touched.')){od.forEach(o=>{const i=db.scenarios.indexOf(o);db.scenarios[i]=clone(SEED.scenarios.find(x=>x.id===o.id));upd++});db.seedVersion=SEED_VERSION}
 else if(!od.length)db.seedVersion=SEED_VERSION;
 save();render();banner();toast(add||upd?('Added '+add+', updated '+upd):(od.length?'No changes':'Already up to date'))}
$('loadT').onclick=loadLatest;
function banner(){const n=outdated().length;let b=$('upd');if(!b){b=document.createElement('div');b.id='upd';b.style.cssText='background:#fff3cd;border:1px solid #e0c060;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px';$('notes').before(b)}
 b.style.display=n?'block':'none';b.innerHTML=n?n+' built-in template(s) have a newer version. Tap <b>Load latest templates</b> to update.':''}
banner();
</script></body></html>
